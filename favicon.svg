<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gDev" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gOps" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <!-- clip so loops stay inside the tile -->
    <clipPath id="tile">
      <rect width="64" height="64" rx="10"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="10" fill="#0d1117"/>

  <g clip-path="url(#tile)">
    <!-- left lobe (Ops/orange) — drawn first, goes "behind" at crossing -->
    <path d="M32,32 C28,14 6,20 6,32 C6,44 28,50 32,32"
          fill="none" stroke="url(#gOps)" stroke-width="4.5"
          stroke-linecap="round"/>

    <!-- right lobe (Dev/blue) — drawn second, sits "over" left at crossing -->
    <path d="M32,32 C36,14 58,20 58,32 C58,44 36,50 32,32"
          fill="none" stroke="url(#gDev)" stroke-width="4.5"
          stroke-linecap="round"/>
  </g>

  <!-- LG figure — centred, sized to fill the ∞ waist -->
  <image href="data:image/png;base64,"
         x="15" y="12" width="34" height="38"/>
</svg>